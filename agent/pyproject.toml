[project]
name = "sistema-prefeitura-agent"
version = "1.0.0"
description = "Agente desktop: autentica com certificado digital local e executa automações Playwright"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "cryptography>=43.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "packaging>=24.0",
    'wincertstore>=0.2; sys_platform == "win32"',
]

[project.scripts]
sistema-agent = "sistema_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sistema_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
